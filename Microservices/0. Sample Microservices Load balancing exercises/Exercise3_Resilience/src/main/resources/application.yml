spring:
  cloud:
    gateway:
      routes:
        - id: circuit_route
          # Deliberately unreachable backend so the circuit breaker trips.
          uri: http://localhost:1
          predicates:
            - Path=/cb/**
          filters:
            - name: CircuitBreaker
              args:
                name: exampleCircuitBreaker
                fallbackUri: forward:/fallback

resilience4j:
  circuitbreaker:
    instances:
      exampleCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
