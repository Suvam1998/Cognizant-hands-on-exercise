server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

# To use MySQL/PostgreSQL instead, add the driver dependency and replace the
# datasource block, e.g. for MySQL:
#   spring.datasource.url: jdbc:mysql://localhost:3306/userdb
#   spring.datasource.username / password: ...
