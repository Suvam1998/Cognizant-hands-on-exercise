server:
  port: 8083

spring:
  application:
    name: product-service
  # Pull centralized configuration from the Config Server (optional so the
  # service still starts if the Config Server is down).
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

# Register with the Eureka service registry.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
