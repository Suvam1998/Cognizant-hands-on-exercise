# Test profile: H2 in-memory (no MySQL needed)
spring.datasource.driver-class-name=org.h2.Driver
# IGNORECASE=TRUE makes H2's string matching case-insensitive, emulating
# MySQL's default (utf8_general_ci) collation that the exercise output assumes.
spring.datasource.url=jdbc:h2:mem:ormlearn;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

logging.level.org.hibernate.SQL=info
