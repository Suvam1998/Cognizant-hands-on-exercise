# Exercise 1: H2 database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Exercise 10: Hibernate batch processing / performance tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ---------------------------------------------------------------------------
# Exercise 9: externalized / multiple data sources.
# Spring Boot auto-configures the primary datasource from spring.datasource.*.
# A second datasource would be added under its own prefix and wired with a
# dedicated @Configuration (a @Primary DataSource + a secondary DataSource
# built from these properties), e.g.:
#   app.secondary.datasource.url=jdbc:h2:mem:seconddb
#   app.secondary.datasource.username=sa
#   app.secondary.datasource.password=password
